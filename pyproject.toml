[project]
name = "image-gateway"
version = "0.1.0"
description = "Safety and marking gateway in front of an OpenAI-compatible image API (vLLM-Omni): prompt and image checks, invisible watermark, sane defaults"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=11",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# The real checkers and the watermark. Only the container needs them; the tests use fakes.
models = [
    "torch>=2.6",
    "transformers>=4.51",
    "accelerate>=1.0",
    "trustmark>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["image_gateway"]
known-local-folder = ["fakes"]
